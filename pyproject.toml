[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rashomon"
version = "0.1.1"
description = "Run a vague ticket through five independent, repo-grounded interpretations. Where they disagree is the short list of questions worth asking before coding."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Flavio Gouveia" }]
keywords = ["langgraph", "agents", "requirements", "spec", "clarify", "llm", "spec-kit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1",
  "langchain>=1.0",
  "langchain-core>=1.8",
  "langchain-anthropic>=1.7",
  "langchain-openai>=1.8",
  "pydantic>=2.14",
  "rich>=15",
  "typer>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
rashomon = "rashomon.cli:app"

[project.urls]
Homepage = "https://github.com/flaviorg/rashomon"
Repository = "https://github.com/flaviorg/rashomon"
Issues = "https://github.com/flaviorg/rashomon/issues"
Changelog = "https://github.com/flaviorg/rashomon/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/rashomon"]

[tool.hatch.build.targets.wheel.force-include]
"examples/invoice_app" = "rashomon/_examples/invoice_app"
"examples/tickets" = "rashomon/_examples/tickets"
"examples/backtest" = "rashomon/_examples/backtest"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "C4", "PT"]
ignore = ["S101", "S603", "S607", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011", "PT018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["rashomon"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
